data_config:
  batch_size: 128
  data_path: ./data/train
  dataset: hls4ml
  n_particles: 64
  np_data: true
  percentage: 100
  target_labels:
  - g
  - q
  - w
  - z
  - t
  validation_split: 0.2
hls4ml_config: {}
model: ParticleTransformer
model_config:
  activation: gelu
  ckpt_path: ./pre-trained/ParticleTransformer/ParT_kin.pt
  embed_dims:
  - 128
  - 512
  - 128
  fc_params:
  - - 128
    - 0.1
  - - 64
    - 0.1
  features: kin
  for_inference: false
  from_pretrained: true
  input_dim: 4
  n_classes: 5
  num_cls_layers: 2
  num_heads: 8
  num_layers: 8
  pair_embed_dims:
  - 64
  - 64
  - 64
  pair_extra_dim: 0
  pair_input_dim: 4
  pf_input_dim: 7
  remove_self_pair: false
  trim: true
  use_amp: false
  use_pre_activation_pair: false
output: ./output/particle_transformer
quantization_config: {}
run_config:
  debug: false
  logger: true
  plotting: true
  verbose: true
training_config:
  callbacks:
    EarlyStopping:
      monitor: val_loss
      patience: 15
    ModelCheckpoint:
      monitor: val_loss
      save_best_only: true
  epochs: 100
  loss: cross_entropy
  metrics:
    accuracy: null
    auroc: null
    confusion_matrix: null
  optimizer: adamw
  optimizer_params:
    lr: 0.0001
    weight_decay: 0.01
  scheduler: cosine
  scheduler_params:
    T_max: 100
    eta_min: 1.0e-06

data_config:
  batch_size: 512
  data_path: ./data/train
  dataset: hls4ml
  n_particles: 128
  np_data: true
  percentage: 100
  target_labels:
  - g
  - q
  - w
  - z
  - t
  validation_split: 0.1
hls4ml_config: {}
model: ParticleTransformer
model_config:
  activation: gelu
  ckpt_path: ./pre-trained/ParticleTransformer/ParT_kin.pt
  embed_dims:
  - 128
  - 512
  - 128
  fc_params:
  - - 128
    - 0.1
  features: kin
  for_inference: false
  from_pretrained: true
  input_dim: 4
  n_classes: 5
  num_cls_layers: 2
  num_heads: 8
  num_layers: 8
  pair_embed_dims:
  - 64
  - 64
  - 64
  pair_extra_dim: 0
  pair_input_dim: 4
  pf_input_dim: 7
  remove_self_pair: false
  trim: true
  use_amp: false
  use_pre_activation_pair: false
output: ./output/particle_transformer
quantization_config: {}
run_config:
  debug: false
  logger: true
  plotting: true
training_config:
  epochs: 50
  log_interval: 250
  loss: cross_entropy
  optimizer: adamw
  optimizer_params:
    lr: 0.001
    weight_decay: 0.001
  scheduler: cosine_with_warmup
  scheduler_params:
    eta_min: 1.0e-05
    warmup_steps: 10

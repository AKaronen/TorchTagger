data_config:
  balance_classes: true
  batch_size: 128
  data_path: ./training_data
  n_particles: 32
  np_data: false
  percentage: 50
  target_labels:
  - bb
  - cc
  - qq
  - qcd
  validation_split: 0.2
hls4ml_config: {}
model: DeepSetModel
model_config:
  aggregator: mean
  classification_layers:
  - 32
  conv1d_layers:
  - 32
  - 32
  - 32
  n_classes: 4
  n_features: 24
output: ./output/deepset32_fj
quantization_config: {}
run_config:
  logger: true
  plotting: true
  verbose: true
training_config:
  callbacks:
    EarlyStopping:
      monitor: val_loss
      patience: 10
    ModelCheckpoint:
      monitor: val_loss
      save_best_only: true
  epochs: 1000
  metrics:
  - accuracy:
      name: accuracy
  - accuracy:
      name: accuracy_per_class
      return_per_class: true
  - auroc: null
  - confusion_matrix: null
  optimizer: adam
  optimizer_params:
    lr: 0.0032
  scheduler: reduce_on_plateau
  scheduler_params:
    factor: 0.1
    min_lr: 1.0e-06
    mode: min
    patience: 5

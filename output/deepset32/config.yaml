data_config:
  batch_size: 128
  data_path: ./data/train
  dataset: hls4ml
  fields:
  - pt
  - etarel
  - phirel
  n_particles: 32
  np_data: true
  percentage: 100
  shuffle_constits: true
  target_labels:
  - g
  - q
  - w
  - z
  - t
  validation_split: 0.1
hls4ml_config: {}
model: DeepSetModel
model_config:
  aggregator: mean
  classification_layers:
  - 32
  conv1d_layers:
  - 32
  - 32
  - 32
  n_classes: 5
  n_features: 3
output: ./output/deepset32
quantization_config: {}
run_config:
  debug: false
  logger: true
  plotting: true
  verbose: true
training_config:
  callbacks:
    EarlyStopping:
      monitor: val_loss
      patience: 15
    ModelCheckpoint:
      monitor: val_loss
      save_best_only: true
  epochs: 1000
  metrics:
    accuracy: null
    auroc: null
    confusion_matrix: null
  optimizer: adam
  optimizer_params:
    lr: 0.0032
  scheduler: reduce_on_plateau
  scheduler_params:
    factor: 0.1
    min_lr: 1.0e-06
    mode: min
    patience: 5

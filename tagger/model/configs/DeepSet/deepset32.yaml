model: DeepSetModel
output: ./output/deepset32
run_config:
  debug: False
  plotting: True
  logger: True
  verbose: True
model_config:
  # expected number of input features per particle
  n_features: 3
  # number of output classes
  n_classes: 5
  # conv layers applied per particle (1x conv)
  conv1d_layers: [32, 32, 32]
  classification_layers: [32]
  aggregator: mean
quantization_config: {}
training_config:
  #log_interval: 2000
  epochs: 1000
  optimizer: adam
  optimizer_params:
    lr: 0.0032
  scheduler: reduce_on_plateau
  scheduler_params:
    mode: min
    factor: 0.1
    patience: 5
    min_lr: 1e-6
  callbacks:
      EarlyStopping:
        monitor: val_loss
        patience: 15
      ModelCheckpoint:
        monitor: val_loss
        save_best_only: true
  metrics:
      - accuracy:
      - auroc:
      - confusion_matrix:
data_config:
  dataset: hls4ml
  np_data: true
  data_path: ./data/train
  percentage: 100
  batch_size: 128
  validation_split: 0.1
  n_particles: 32
  fields: [pt, etarel, phirel] # 4 vec
  shuffle_constits: true 
  target_labels: ['g', 'q', 'w', 'z', 't']
  #[
  #      "px",
  #      "py",
  #      "pz",
  #      "e",
  #      "erel",
  #      "pt",
  #      "ptrel",
  #      "eta",
  #      "etarel",

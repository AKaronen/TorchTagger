model: LorentzNet
output: ./output/lorentznet
run_config:
  debug: False
  plotting: True
  logger: True
model_config:
  n_scalar: 12
  n_hidden: 64
  n_layers: 5
  c_weight: 5e-3
  dropout: 0.3
  n_classes: 5
quantization_config: {}
training_config:
  epochs: 50
  log_interval: 1000 # log every n batches
  #optimizer: sgd
  #optimizer_params:
  #  lr: 1e-4
  #  momentum: 0.9
  #  weight_decay: 0.0001
  optimizer: adamw
  optimizer_params:
    lr: 1e-5
    weight_decay: 1e-3
  loss: cross_entropy   # default loss function
  #scheduler: "reduce_on_plateau"  # optional learning rate scheduler
  #scheduler_params:
  #  mode: min
  #  factor: 0.5
  #  patience: 3
  #  min_lr: 1e-6
  scheduler: "cosine_with_warmup"
  scheduler_params:
    warmup_steps: 5
    eta_min: 1e-7
data_config:
  dataset: hls4ml # set np_data to true for numpy-based data loading
  np_data: true
  data_path: ./data/train
  percentage: 100 # percentage of data loaded (for quick tests)
  batch_size: 100
  validation_split: 0.2
  #max_particles: 100
  #shuffle: true
  #num_workers: 4
  #pin_memory: true
  #drop_last: true

hls4ml_config: {}
